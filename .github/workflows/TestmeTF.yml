name: Terraform Deploy (AWS)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      terraform_version:
        description: "Terraform version"
        required: false
        default: "1.7.0"

permissions:
  id-token: write   # Required for OIDC auth with AWS
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: ./terraform
  AWS_REGION: us-east-1

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Terraform Plan
  # ─────────────────────────────────────────────
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_{0}', upper(github.event.inputs.environment))] }}
          aws-region: ${{ env.AWS_REGION }}
          # e.g. secrets: AWS_ROLE_DEV, AWS_ROLE_STAGING, AWS_ROLE_PRODUCTION

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ github.event.inputs.terraform_version }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate"

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="envs/${{ github.event.inputs.environment }}.tfvars" \
            -out=tfplan \
            -detailed-exitcode \
            -input=false
        continue-on-error: true  # exitcode 2 = changes detected (not an error)

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7

      - name: Post plan summary
        run: |
          echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Plan exit code:** ${{ steps.plan.outputs.exitcode }}" >> $GITHUB_STEP_SUMMARY
          echo "  - 0 = No changes" >> $GITHUB_STEP_SUMMARY
          echo "  - 1 = Error" >> $GITHUB_STEP_SUMMARY
          echo "  - 2 = Changes detected" >> $GITHUB_STEP_SUMMARY

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # ─────────────────────────────────────────────
  # JOB 2: Manual Approval Gate
  # Requires a GitHub Environment named e.g.
  # "production-approval" with required reviewers.
  # ─────────────────────────────────────────────
  approval:
    name: "Waiting for Approval"
    needs: plan
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.action == 'apply' ||
      github.event.inputs.action == 'destroy'
    environment:
      name: "${{ github.event.inputs.environment }}-approval"
      # ⬆ Set up this environment in GitHub repo Settings →
      # Environments → Add required reviewers (your approvers)

    steps:
      - name: Approval granted
        run: |
          echo "✅ Deployment to ${{ github.event.inputs.environment }} approved by ${{ github.actor }}"
          echo "## ✅ Approved" >> $GITHUB_STEP_SUMMARY
          echo "Approved by **${{ github.actor }}** at $(date -u)" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # JOB 3: Terraform Apply / Destroy
  # ─────────────────────────────────────────────
  apply:
    name: "Terraform ${{ github.event.inputs.action }}"
    needs: [plan, approval]
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.action == 'apply' ||
      github.event.inputs.action == 'destroy'
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_{0}', upper(github.event.inputs.environment))] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ github.event.inputs.terraform_version }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate"

      - name: Download plan artifact
        if: github.event.inputs.action == 'apply'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy \
            -var-file="envs/${{ github.event.inputs.environment }}.tfvars" \
            -input=false \
            -auto-approve

      - name: Post apply summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Completed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
